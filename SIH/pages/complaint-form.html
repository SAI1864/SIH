<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaint Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
    }
    header {
      background: #004aad;
      color: white;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .profile {
      display: flex;
      align-items: center;
    }
    .profile img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      margin-right: 10px;
    }
    .container {
      max-width: 800px;
      margin: 30px auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    h3 {
      color: #004aad;
      margin-bottom: 15px;
    }
    label {
      font-weight: bold;
      margin-top: 12px;
      display: block;
    }
    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    textarea { resize: none; }
    button {
      margin-top: 20px;
      background: #004aad;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #003080; }
    #map {
      height: 250px;
      width: 100%;
      margin-top: 10px;
      border-radius: 8px;
    }
    .location-box {
      margin-top: 8px;
      padding: 8px;
      background: #eef6ff;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<header>
  <h2>Complaint Portal</h2>
  <div class="profile">
    <img src="https://via.placeholder.com/50" alt="Profile">
    <span id="username">Citizen User</span>
  </div>
</header>

<div class="container">
  <h3>File Your Complaint</h3>

  <!-- Upload photo -->
  <label for="photoInput">Upload/Click Photo:</label>
  <input type="file" id="photoInput" accept="image/*" capture="environment">

  <!-- Upload video -->
  <label for="videoInput">Upload/Record Video:</label>
  <input type="file" id="videoInput" accept="video/*" capture="environment">

  <!-- Description -->
  <label for="complaintText">Event Description:</label>
  <textarea id="complaintText" rows="4" placeholder="Write your complaint..."></textarea>

  <!-- Location -->
  <label>Detected Location (Auto from GPS):</label>
  <div id="locationBox" class="location-box">Fetching location...</div>
  <input type="hidden" id="locationInput">

  <!-- Google Map -->
  <div id="map"></div>

  <!-- Submit -->
  <button onclick="lodgeComplaint()"><i class="fa-solid fa-file-pen"></i> Lodge Complaint</button>
</div>

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- Google Maps API -->

<script async
  src="AIzaSyCzf8TYXVbUIfIGjuFL-Jo3yzI5pn6lZ5Y" async
    defer>
</script>


<script>
let map, marker;

// Init Google Map
function initMap() {
  map = new google.maps.Map(document.getElementById("map"), {
    zoom: 15,
    center: { lat: 20.5937, lng: 78.9629 } // Default India
  });
  getLocation();
}

// Fetch location
function getLocation() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(showPosition, showError);
  } else {
    document.getElementById("locationBox").innerText = "Geolocation not supported.";
  }
}

function showPosition(position) {
  let lat = position.coords.latitude;
  let lon = position.coords.longitude;

  let locText = "Latitude: " + lat.toFixed(5) + ", Longitude: " + lon.toFixed(5);
  document.getElementById("locationBox").innerText = locText;
  document.getElementById("locationInput").value = locText;

  let loc = { lat: lat, lng: lon };
  map.setCenter(loc);
  marker = new google.maps.Marker({ position: loc, map: map, title: "Complaint Location" });
}

function showError(error) {
  document.getElementById("locationBox").innerText = "Unable to fetch location.";
}

// Generate unique token
function generateToken() {
  return "CMP-" + Math.random().toString(36).substring(2, 10).toUpperCase();
}

// Lodge Complaint & Generate PDF
function lodgeComplaint() {
  const { jsPDF } = window.jspdf;
  let doc = new jsPDF();

  let complaintText = document.getElementById("complaintText").value || "No description";
  let complaintID = generateToken();
  let today = new Date().toLocaleString();
  let username = "Citizen User";
  let locationDetails = document.getElementById("locationInput").value || "Not Available";

  // Build PDF
  doc.setFontSize(18);
  doc.setFont("helvetica", "bold");
  doc.text("Government of India", 105, 20, { align: "center" });
  doc.setFontSize(14);
  doc.text("Complaint Acknowledgement Slip", 105, 30, { align: "center" });
  doc.line(20, 35, 190, 35);

  doc.setFontSize(12);
  let y = 50;
  doc.text("Complaint ID:", 20, y); doc.text(complaintID, 70, y); y+=10;
  doc.text("Date & Time:", 20, y); doc.text(today, 70, y); y+=10;
  doc.text("Complainant:", 20, y); doc.text(username, 70, y); y+=10;
  doc.text("Location:", 20, y); doc.text(locationDetails, 70, y, { maxWidth: 120 }); y+=20;
  doc.text("Complaint Description:", 20, y); y+=10;
  doc.text(complaintText, 20, y, { maxWidth: 170 }); y+=10;

  // Add uploaded image if available
  let photoFile = document.getElementById("photoInput").files[0];
  if (photoFile) {
    let reader = new FileReader();
    reader.onload = function(e) {
      let imgData = e.target.result;
      doc.addImage(imgData, "JPEG", 20, y+10, 80, 60); // Add image inside PDF
      y += 75;
      finalizePDF(doc, complaintID, y);
    };
    reader.readAsDataURL(photoFile);
  } else {
    finalizePDF(doc, complaintID, y);
  }
}

function finalizePDF(doc, complaintID, y) {
  // Add video/audio references
  let videoFile = document.getElementById("videoInput").files[0];
  if (videoFile) {
    doc.text("🎥 Video Uploaded: " + videoFile.name, 20, y+10);
    y += 15;
  }

  doc.setFont("helvetica", "bold");
  doc.text("Status: Lodged ✅", 20, y+20);

  doc.setFontSize(10);
  doc.text("This is a computer-generated acknowledgement slip.", 105, 280, { align: "center" });

  doc.save(complaintID + "_Acknowledgement.pdf");
  alert("✅ Complaint lodged! PDF with photo downloaded.");
}
</script>
  <style>
    #chatbot-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #4e54c8;
      color: white;
      border: none;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
      z-index: 1001;
    }

    #chatbot-widget {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 350px;
      max-height: 500px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 1000;
    }

    .chat-container {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      font-family: Arial, sans-serif;
      max-height: 350px;
    }

    .msg {
      margin: 8px 0;
      padding: 10px;
      border-radius: 10px;
      max-width: 75%;
      word-wrap: break-word;
    }
    .user { background: #4e54c8; color: white; margin-left: auto; }
    .bot { background: #e5e7eb; color: black; margin-right: auto; }

    .input-area {
      display: flex;
      border-top: 1px solid #ddd;
      padding: 8px;
      background: #fff;
    }

    .input-area input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
    }

    .input-area button {
      margin-left: 8px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #4e54c8;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Toggle Button -->
  <button id="chatbot-toggle">💬</button>

  <!-- Chatbot Widget -->
  <div id="chatbot-widget">
    <div class="chat-container" id="chat-container">
      <div class="msg bot">Hello 👋, I’m your AI assistant. How can I help you?</div>
    </div>

    <div class="input-area">
      <input type="text" id="user-input" placeholder="Type your message...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const chatbot = document.getElementById("chatbot-widget");
    const toggleBtn = document.getElementById("chatbot-toggle");
    const chatContainer = document.getElementById("chat-container");
    const userInput = document.getElementById("user-input");

    // Toggle chatbot visibility
    toggleBtn.addEventListener("click", () => {
      chatbot.style.display = chatbot.style.display === "none" ? "flex" : "none";
    });

    // Send message
    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      addMessage(text, "user");
      userInput.value = "";

      // Call AI backend (replace with your API endpoint)
      addMessage("🤔 Thinking...", "bot");
      try {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer YOUR_OPENAI_API_KEY" // Replace with your key
          },
          body: JSON.stringify({
            model: "gpt-3.5-turbo",
            messages: [{ role: "user", content: text }]
          })
        });
        const data = await response.json();
        const botReply = data.choices[0].message.content;
        
        // Remove "Thinking..." and add real reply
        chatContainer.lastChild.remove();
        addMessage(botReply, "bot");
      } catch (err) {
        chatContainer.lastChild.remove();
        addMessage("⚠️ Sorry, I couldn’t reach the AI service.", "bot");
      }
    }

    // Helper to add chat bubbles
    function addMessage(text, type) {
      const msg = document.createElement("div");
      msg.classList.add("msg", type);
      msg.innerText = text;
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
  </script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


</body>
</html>
