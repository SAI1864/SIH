<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaint Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 0; }
    header { background: #004aad; color: white; padding: 15px; display: flex; align-items: center; justify-content: space-between; }
    .profile { display: flex; align-items: center; }
    .profile img { width: 50px; height: 50px; border-radius: 50%; margin-right: 10px; }
    .container { max-width: 800px; margin: 30px auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    h3 { color: #004aad; margin-bottom: 15px; }
    label { font-weight: bold; margin-top: 12px; display: block; }
    input, textarea { width: 100%; padding: 10px; margin-top: 6px; border-radius: 8px; border: 1px solid #ccc; }
    textarea { resize: none; }
    button { margin-top: 20px; background: #004aad; color: white; border: none; padding: 12px; border-radius: 10px; font-size: 16px; cursor: pointer; }
    button:hover { background: #003080; }
    #map { height: 250px; width: 100%; margin-top: 10px; border-radius: 8px; }
    .location-box { margin-top: 8px; padding: 8px; background: #eef6ff; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
  </style>
</head>
<body>

<header>
  <h2>Complaint Portal</h2>
  <div class="profile">
    <img src="https://via.placeholder.com/50" alt="Profile">
    <span id="username">Citizen User</span>
  </div>
</header>

<div class="container">
  <h3>File Your Complaint</h3>

  <label for="photoInput">Upload/Click Photo:</label>
  <input type="file" id="photoInput" accept="image/*" capture="environment">

  <label for="videoInput">Upload/Record Video:</label>
  <input type="file" id="videoInput" accept="video/*" capture="environment">

  <label for="complaintText">Event Description:</label>
  <textarea id="complaintText" rows="4" placeholder="Write your complaint..."></textarea>

  <label>Detected Location (Auto from GPS):</label>
  <div id="locationBox" class="location-box">Fetching location...</div>
  <input type="hidden" id="locationInput">

  <div id="map"></div>

  <button onclick="lodgeComplaint()"><i class="fa-solid fa-file-pen"></i> Lodge Complaint</button>
</div>

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script async defer src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
let map, marker;

// ✅ Supabase credentials (replace with your project keys)
const SUPABASE_URL = "https://cfxsfarkbeulvxdwzpzc.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNmeHNmYXJrYmV1bHZ4ZHd6cHpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg1NjUzNzYsImV4cCI6MjA3NDE0MTM3Nn0.m7ejp8l773mVpswh99EKIgeZfMgPrCH4zsubYHceEbg";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Init Google Map
function initMap() {
  map = new google.maps.Map(document.getElementById("map"), {
    zoom: 15,
    center: { lat: 20.5937, lng: 78.9629 }
  });
  getLocation();
}

// Fetch location
function getLocation() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(showPosition, showError);
  } else {
    document.getElementById("locationBox").innerText = "Geolocation not supported.";
  }
}
function showPosition(position) {
  let lat = position.coords.latitude;
  let lon = position.coords.longitude;
  let locText = "Latitude: " + lat.toFixed(5) + ", Longitude: " + lon.toFixed(5);
  document.getElementById("locationBox").innerText = locText;
  document.getElementById("locationInput").value = locText;
  let loc = { lat: lat, lng: lon };
  map.setCenter(loc);
  marker = new google.maps.Marker({ position: loc, map: map, title: "Complaint Location" });
}
function showError() {
  document.getElementById("locationBox").innerText = "Unable to fetch location.";
}

// Generate unique token
function generateToken() {
  return "CMP-" + Math.random().toString(36).substring(2, 10).toUpperCase();
}

// Lodge Complaint
async function lodgeComplaint() {
  const { jsPDF } = window.jspdf;
  let doc = new jsPDF();

  let complaintText = document.getElementById("complaintText").value || "No description";
  let complaintID = generateToken();
  let today = new Date().toISOString();
  let username = "Citizen User";
  let locationDetails = document.getElementById("locationInput").value || "Not Available";

  // ✅ Save complaint into Supabase
  const { data, error } = await supabase
    .from("complaints")
    .insert([
      {
        complaint_id: complaintID,
        complainant_name: username,
        complaint_text: complaintText,
        location: locationDetails,
        date_time: today
      }
    ]);

  if (error) {
    console.error("❌ Error saving complaint:", error);
    alert("Error saving complaint to database.");
    return;
  } else {
    console.log("✅ Complaint saved:", data);
  }

  // --- Generate PDF acknowledgement ---
  doc.setFontSize(18);
  doc.setFont("helvetica", "bold");
  doc.text("Government of India", 105, 20, { align: "center" });
  doc.setFontSize(14);
  doc.text("Complaint Acknowledgement Slip", 105, 30, { align: "center" });
  doc.line(20, 35, 190, 35);

  doc.setFontSize(12);
  let y = 50;
  doc.text("Complaint ID:", 20, y); doc.text(complaintID, 70, y); y+=10;
  doc.text("Date & Time:", 20, y); doc.text(today, 70, y); y+=10;
  doc.text("Complainant:", 20, y); doc.text(username, 70, y); y+=10;
  doc.text("Location:", 20, y); doc.text(locationDetails, 70, y, { maxWidth: 120 }); y+=20;
  doc.text("Complaint Description:", 20, y); y+=10;
  doc.text(complaintText, 20, y, { maxWidth: 170 }); y+=10;

  finalizePDF(doc, complaintID, y);
}

function finalizePDF(doc, complaintID, y) {
  doc.setFont("helvetica", "bold");
  doc.text("Status: Lodged ✅", 20, y+20);
  doc.setFontSize(10);
  doc.text("This is a computer-generated acknowledgement slip.", 105, 280, { align: "center" });
  doc.save(complaintID + "_Acknowledgement.pdf");
  alert("✅ Complaint lodged! Data saved & PDF downloaded.");
}
</script>
