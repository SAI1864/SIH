<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Chatbot</title>
  <style>
    #chatbot-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #4e54c8;
      color: white;
      border: none;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
      z-index: 1001;
    }

    #chatbot-widget {
      position: fixed;
      bottom: 90px;
      right: 20px;
      width: 350px;
      max-height: 500px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 1000;
    }

    .chat-container {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      font-family: Arial, sans-serif;
      max-height: 350px;
    }

    .msg {
      margin: 8px 0;
      padding: 10px;
      border-radius: 10px;
      max-width: 75%;
      word-wrap: break-word;
    }
    .user { background: #4e54c8; color: white; margin-left: auto; }
    .bot { background: #e5e7eb; color: black; margin-right: auto; }

    .input-area {
      display: flex;
      border-top: 1px solid #ddd;
      padding: 8px;
      background: #fff;
    }

    .input-area input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
    }

    .input-area button {
      margin-left: 8px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #4e54c8;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Toggle Button -->
  <button id="chatbot-toggle">💬</button>

  <!-- Chatbot Widget -->
  <div id="chatbot-widget">
    <div class="chat-container" id="chat-container">
      <div class="msg bot">Hello 👋, I’m your AI assistant. How can I help you?</div>
    </div>

    <div class="input-area">
      <input type="text" id="user-input" placeholder="Type your message...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const chatbot = document.getElementById("chatbot-widget");
    const toggleBtn = document.getElementById("chatbot-toggle");
    const chatContainer = document.getElementById("chat-container");
    const userInput = document.getElementById("user-input");

    // Toggle chatbot visibility
    toggleBtn.addEventListener("click", () => {
      chatbot.style.display = chatbot.style.display === "none" ? "flex" : "none";
    });

    // Send message
    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      addMessage(text, "user");
      userInput.value = "";

      // Call AI backend (replace with your API endpoint)
      
      try {const apikey=""
      addMessage("🤔 Thinking...", "bot");
        
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer YOUR_OPENAI_API_KEY" // Replace with your key
          },
          body: JSON.stringify({
            model: "gpt-3.5-turbo",
            messages: [{ role: "user", content: text }]
          })
        });
        const data = await response.json();
        const botReply = data.choices[0].message.content;
        
        // Remove "Thinking..." and add real reply
        chatContainer.lastChild.remove();
        addMessage(botReply, "bot");
      } catch (err) {
        chatContainer.lastChild.remove();
        addMessage("⚠️ Sorry, I couldn’t reach the AI service.", "bot");
      }
    }

    // Helper to add chat bubbles
    function addMessage(text, type) {
      const msg = document.createElement("div");
      msg.classList.add("msg", type);
      msg.innerText = text;
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
  </script>
</body>
</html>
