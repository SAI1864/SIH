<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complaint Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: #fff;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      width: 400px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #2c3e50;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }
    input, textarea {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #3498db;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #2980b9;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Complaint Form</h2>
    <form id="complaintForm">

      <label>Complainant Name</label>
      <input type="text" id="name" required>

      <label>Complaint Text</label>
      <textarea id="complaint_text" rows="4" required></textarea>

      <label>Location</label>
      <input type="text" id="location" required>

      <label>Date & Time</label>
      <input type="datetime-local" id="datetime" required>

      <label>Upload/Click Photo</label>
      <input type="file" id="photo_url"accept="image/*" capture="environment">

      <label>Video URL</label>
      <input type="url" id="video_url">

      <button type="submit">Submit Complaint</button>
    </form>
  </div>

  <!-- Supabase -->
  <script src="https://unpkg.com/@supabase/supabase-js"></script>
  <script>
    const { createClient } = supabase;
    const supabaseUrl = "https://banihyzrzmtukqwjrnnf.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJhbmloeXpyem10dWtxd2pybm5mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg1Njg5MjMsImV4cCI6MjA3NDE0NDkyM30.6pWpf-PZDTWOIBccZjAVGvsVuftEBskypQjGHNif-B0";
    const db = createClient(supabaseUrl, supabaseKey);

    document.getElementById("complaintForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const complaint = {
        name: document.getElementById("name").value,
        complaint_text: document.getElementById("complaint_text").value,
        location: document.getElementById("location").value,
        datetime: document.getElementById("datetime").value,
        photo_url: document.getElementById("photo_url").value,
        video_url: document.getElementById("video_url").value,
      };

      let { data, error } = await db.from("complaints").insert([complaint]).select();

      if (error) {
        alert("Error: " + error.message);
      } else {
        alert("Complaint submitted! Your Complaint ID is: " + data[0].complaint_id);
        document.getElementById("complaintForm").reset();
      }
    });
  </script>
</body>
</html>
